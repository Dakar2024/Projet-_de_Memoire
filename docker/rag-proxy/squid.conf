# Proxy sortant du RAG : seule sortie Internet. Tunnels HTTPS (CONNECT) vers les
# fournisseurs LLM autorisés, rien d'autre. Aucun cache, aucune inspection du contenu.
http_port 3128
# Seuls clients admis : le réseau rag-proxy-net (sous-réseau fixé dans docker-compose.yml).
acl rag_clients src 172.31.250.0/24
# `-n` : comparaison au seul nom demandé, jamais à une résolution inverse (PTR). Sans lui,
# un CONNECT vers une IP dont le PTR annonce openrouter.ai serait accepté.
acl llm_hosts dstdomain -n openrouter.ai api.groq.com
# Destination donnée en IP littérale (IPv4, ou IPv6 entre crochets) : toujours refusée.
acl to_ip dstdom_regex -n ^[0-9.]+$ ^\[
acl ssl_port port 443
acl CONNECT method CONNECT
http_access deny !rag_clients
http_access deny !CONNECT
http_access deny CONNECT !ssl_port
http_access deny CONNECT to_ip
http_access allow CONNECT llm_hosts
http_access deny all
cache deny all
cache_mem 0 MB
# Pas de sonde ICMP : le conteneur tourne sans capacité (NET_RAW retirée).
pinger_enable off
# Journal minimal : heure, client, résultat/statut, méthode, hôte:port, octets. Jamais
# d'URL complète ni de chaîne de requête (un tunnel HTTPS ne révèle de toute façon que
# l'hôte et le port).
logformat ragmin %ts.%03tu %>a %Ss/%03>Hs %rm %>rd:%>rP %<st
access_log stdio:/dev/stdout ragmin
cache_log stdio:/dev/stderr
pid_filename none
coredump_dir /tmp
