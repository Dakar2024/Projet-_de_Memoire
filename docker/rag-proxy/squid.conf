# Proxy sortant du RAG : uniquement des tunnels HTTPS vers les fournisseurs LLM autorisés, sans cache.
http_port 3128
# Seuls clients admis : rag-proxy-net (sous-réseau fixé dans docker-compose.yml).
acl rag_clients src 172.31.250.0/24
# `-n` : nom demandé seulement, jamais de résolution inverse (PTR).
acl llm_hosts dstdomain -n openrouter.ai api.groq.com
# Destination donnée en IP littérale (IPv4, ou IPv6 entre crochets) : toujours refusée.
acl to_ip dstdom_regex -n ^[0-9.]+$ ^\[
acl ssl_port port 443
acl CONNECT method CONNECT
http_access deny !rag_clients
http_access deny !CONNECT
http_access deny CONNECT !ssl_port
http_access deny CONNECT to_ip
http_access allow CONNECT llm_hosts
http_access deny all
cache deny all
cache_mem 0 MB
# Pas de sonde ICMP : le conteneur tourne sans capacité (NET_RAW retirée).
pinger_enable off
# Journal minimal : jamais d'URL complète ni de chaîne de requête.
logformat ragmin %ts.%03tu %>a %Ss/%03>Hs %rm %>rd:%>rP %<st
access_log stdio:/dev/stdout ragmin
cache_log stdio:/dev/stderr
pid_filename none
coredump_dir /tmp
