# Quatre règles, chacune pour un angle mort des mails d'Airflow (spec D6, §6).
# $values est vide sans données ou en cas d'erreur de requête : chaque message prévoit ce cas.
# Aucune sur les échecs de tâches : Airflow les signale déjà, avec le message d'erreur.
apiVersion: 1
groups:
  - orgId: 1
    name: genomique
    folder: Génomique
    interval: 1m
    rules:
      - uid: silence-pipeline
        title: Aucun run réussi depuis 40 jours
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # Jours écoulés depuis le dernier succès, par DAG ; 0 (jamais) donne une valeur énorme.
              expr: (time() - max by (dag) (genomics_last_successful_run_timestamp)) / 86400
          # $values n'expose que les expressions : B réduit A pour le seuil et le message.
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [40]}
        # Exportateur muet : on ne sait plus si le pipeline tourne, ce qui doit aussi alerter.
        noDataState: Alerting
        execErrState: Error
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "{{ if $values.B }}{{ $labels.dag }} : aucun run réussi depuis {{ humanize $values.B.Value }} jours{{ else }}Exportateur muet : impossible de savoir si le pipeline tourne{{ end }}"
          description: >-
            Le run mensuel n'a pas démarré ou n'a pas abouti, sans qu'aucune tâche n'échoue.
            Vérifier le scheduler Airflow, puis consulter reference/procedure_reprise.md.

      - uid: disque-c-presque-plein
        title: Disque D (./data) presque plein
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # Vue du montage ./data (D: depuis le 2026-11-08) ; celle de MinIO (vhdx de WSL) surestime l'espace libre.
              expr: 100 * genomics_free_space_bytes{path="data"} / genomics_total_space_bytes{path="data"}
          # $values n'expose que les expressions : B réduit A pour le seuil et le message.
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [10]}
        # Un trou de collecte (veille du PC) ne dit rien du disque ; la règle cible-injoignable couvre les pannes.
        noDataState: KeepLast
        execErrState: Error
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "{{ if $values.B }}Disque D (./data) : {{ humanize $values.B.Value }} % libres{{ else }}Disque D (./data) : mesure indisponible{{ end }}"
          description: >-
            Sous 10 % libres, le prochain run risque d'échouer faute de place (P3).
            Libérer de l'espace sur D: (données du lac, D:\Backups) ou compacter le vhdx de WSL (D:\WSL\Ubuntu).

      - uid: memoire-conteneur
        title: Conteneur proche de sa limite mémoire
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                100 * container_memory_working_set_bytes{name=~"genomique-.+"}
                / (container_spec_memory_limit_bytes{name=~"genomique-.+"} > 0)
          # $values n'expose que les expressions : B réduit A pour le seuil et le message.
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [90]}
        # Un trou de collecte (veille du PC) ne dit rien de la mémoire ; la règle cible-injoignable couvre les pannes.
        noDataState: KeepLast
        execErrState: Error
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "{{ if $values.B }}{{ $labels.name }} : {{ humanize $values.B.Value }} % de sa limite mémoire{{ else }}Mémoire des conteneurs : mesure indisponible{{ end }}"
          description: >-
            Au-delà de la limite, le noyau tue le processus et Airflow ne voit qu'un échec sans cause.
            Seuil à recalibrer sur le premier run observé (spec §6).

      - uid: cible-injoignable
        title: Cible de monitoring injoignable
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # `up` et non `up == 0` : ce dernier est vide quand tout va bien.
              expr: up
          # $values n'expose que les expressions : B réduit A pour le seuil et le message.
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [1]}
        noDataState: KeepLast
        execErrState: Error
        # 15 min : une veille du PC ne produit qu'un trou, pas de `up` à 0 aussi long.
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "{{ if $values.B }}Cible {{ $labels.job }} injoignable depuis 15 min{{ else }}Prometheus ne répond pas{{ end }}"
          description: >-
            Les règles sur cette cible gardent leur dernier état : le monitoring est aveugle sur elle.
            Vérifier le conteneur avec docker compose --profile monitoring ps.
