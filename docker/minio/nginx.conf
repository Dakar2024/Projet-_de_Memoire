# Proxy devant MinIO : bloque les requêtes des CVE de 2026 corrigées seulement dans AIStor.
# Contournements des avis GHSA de minio/minio, durcis : la stack n'utilise ni URL présignée,
# ni réplication, ni Snowball, ni S3 Select, donc tout usage de ces mécanismes est refusé.

worker_processes  1;

# Racine en lecture seule : seul /tmp (tmpfs) est inscriptible.
pid        /tmp/nginx.pid;
error_log  /dev/stderr warn;

events {
    worker_connections  1024;
}

http {
    # Fichiers temporaires dans le tmpfs.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server_tokens off;

    # Ni chaîne de requête (signatures), ni en-têtes (Authorization).
    log_format  lacmin  '$time_iso8601 $request_method $uri $status $request_time $body_bytes_sent';
    access_log  /dev/stdout  lacmin;

    # DNS de Docker interrogé à chaque requête : une recréation de minio-server ne casse pas le proxy.
    resolver  127.0.0.11  valid=10s  ipv6=off;
    resolver_timeout  5s;

    # Objets de plusieurs Go (bulk ClinVar) : ni limite de taille, ni mise en tampon.
    client_max_body_size     0;
    proxy_request_buffering  off;
    proxy_buffering          off;
    proxy_connect_timeout    5s;
    proxy_read_timeout       300s;
    proxy_send_timeout       300s;

    proxy_http_version  1.1;
    # Host inchangé : il fait partie de la signature SigV4.
    proxy_set_header    Host        $http_host;
    proxy_set_header    Connection  "";

    # CVE-2026-41145, CVE-2026-40344 : trailer non signé. Non ancré : nginx joint les en-têtes
    # dupliqués par « , » alors que MinIO lit le premier.
    map $http_x_amz_content_sha256 $trailer_non_signe {
        ~*STREAMING-UNSIGNED-PAYLOAD-TRAILER  1;
        default                               0;
    }

    # MinIO décode la chaîne de requête (url.ParseQuery) : un caractère non réservé encodé
    # (%2D pour « - », lettre, chiffre…) contournerait les filtres littéraux ci-dessous. Les SDK
    # S3 n'en encodent jamais (forme canonique SigV4).
    map $args $requete_suspecte {
        ~*%(2d|2e|5f|7e|3[0-9]|[46][1-9a-f]|[57][0-9a])  1;
        # URL présignées (41145 par la chaîne de requête), S3 Select (CVE-2026-39414).
        ~*(^|&)(x-amz-(credential|signature|content-sha256)|awsaccesskeyid|select-type)=  1;
        default  0;
    }

    # CVE-2026-34204 (réplication SSE) et CVE-2026-40344 (extraction Snowball) : en-têtes refusés.
    map "$http_x_minio_replication_server_side_encryption_sealed_key$http_x_minio_replication_server_side_encryption_seal_algorithm$http_x_minio_replication_server_side_encryption_iv$http_x_amz_meta_snowball_auto_extract" $entete_interdit {
        ""       0;
        default  1;
    }

    server {
        listen  9000;
        server_name  _;

        set $minio_api  minio-server:9000;

        if ($trailer_non_signe) { return 403; }
        if ($requete_suspecte)  { return 403; }
        if ($entete_interdit)   { return 403; }

        location / {
            proxy_pass  http://$minio_api;
        }
    }

    # Console web : WebSocket (navigateur d'objets), mêmes délais.
    server {
        listen  9001;
        server_name  _;

        set $minio_console  minio-server:9001;

        location / {
            proxy_pass          http://$minio_console;
            # Redéclaré : tout proxy_set_header ici annule ceux hérités du bloc http. Sans lui,
            # la console reçoit Host=minio-server:9001, différent de l'Origin, et refuse le WebSocket (403).
            proxy_set_header    Host        $http_host;
            proxy_set_header    Upgrade     $http_upgrade;
            proxy_set_header    Connection  $http_connection;
        }
    }
}
