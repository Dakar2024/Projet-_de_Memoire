# Passerelle d'entrée de l'API RAG (rag-gateway) — remplace /etc/nginx/nginx.conf de
# l'image nginxinc/nginx-unprivileged (1.30). Docker ne publie aucun port pour un
# conteneur relié seulement à des réseaux internes : la passerelle publie le port sur
# la boucle locale de l'hôte et relaie vers rag-api par le réseau interne
# rag-gateway-net. Elle ne détient aucun secret : la clé X-API-Key est vérifiée par
# l'API elle-même.

worker_processes  1;

# Racine en lecture seule : seul /tmp (tmpfs) est inscriptible.
pid        /tmp/nginx.pid;
error_log  /dev/stderr warn;

events {
    worker_connections  256;
}

http {
    # Fichiers temporaires dans le tmpfs (corps et réponses volumineux, non attendus ici).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server_tokens off;
    default_type  application/json;

    # Journal d'accès minimal : ni corps, ni en-têtes (donc jamais X-API-Key), ni
    # chaîne de requête ($uri est le chemin seul).
    log_format  ragmin  '$time_iso8601 $request_method $uri $status $request_time';
    access_log  /dev/stdout  ragmin;

    # Corps limité comme dans l'API (api.max_body_bytes = 8192) : au-delà, 413 sans relais.
    # Tampon de même taille : un corps accepté reste en mémoire.
    client_max_body_size     8k;
    client_body_buffer_size  8k;

    # Résolveur DNS interne de Docker : le nom rag-api est résolu à chaque requête
    # (variable dans proxy_pass), si bien qu'une recréation de rag-api (nouvelle
    # adresse) ne casse pas la passerelle.
    resolver  127.0.0.11  valid=10s  ipv6=off;
    resolver_timeout  5s;

    # Délais : l'API coupe elle-même à 120 s (503) ; la passerelle attend un peu plus.
    proxy_connect_timeout  5s;
    proxy_read_timeout     130s;
    proxy_send_timeout     30s;

    # Aucun en-tête X-Forwarded-* ajouté ; X-API-Key et Content-Type sont transmis
    # tels quels (en-têtes du client relayés par défaut). Pas de cache ni de compression.
    proxy_http_version  1.1;
    proxy_set_header    Host        rag-api;
    proxy_set_header    Connection  "";
    proxy_buffering     on;

    # Débit des questions par adresse cliente : plafonne la dépense LLM si un processus
    # local boucle (30 par minute, rafale de 10) ; au-delà, 429 sans relais.
    limit_req_zone    $binary_remote_addr  zone=questions:1m  rate=30r/m;
    limit_req_status  429;

    server {
        listen  8080;
        server_name  _;

        set $rag_api_host  rag-api:8000;

        # Aucune route ne prend de chaîne de requête : refusée ici, elle ne peut ni
        # atteindre l'API ni pousser du texte dans ses journaux.
        if ($args != "") { return 404; }

        # Seules trois routes sont relayées, chacune pour une seule méthode ; toute
        # autre méthode ou tout autre chemin reçoit 404 sans atteindre l'API.
        # L'URI relayée est fixe (proxy_pass avec URI) : l'API reçoit exactement
        # /health, /ready ou /v1/questions, jamais le chemin brut du client
        # (« ../ », « %2F » non normalisés) ni ses arguments.
        location = /health {
            if ($request_method != GET) { return 404; }
            proxy_pass  http://$rag_api_host/health;
        }

        location = /ready {
            if ($request_method != GET) { return 404; }
            proxy_pass  http://$rag_api_host/ready;
        }

        location = /v1/questions {
            if ($request_method != POST) { return 404; }
            limit_req   zone=questions  burst=10  nodelay;
            proxy_pass  http://$rag_api_host/v1/questions;
        }

        location / {
            return 404;
        }
    }
}
