# Passerelle de l'API RAG : relaie trois routes vers rag-api, sans secret (la clé est vérifiée par l'API).

worker_processes  1;

# Racine en lecture seule : seul /tmp (tmpfs) est inscriptible.
pid        /tmp/nginx.pid;
error_log  /dev/stderr warn;

events {
    worker_connections  256;
}

http {
    # Fichiers temporaires dans le tmpfs.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server_tokens off;
    default_type  application/json;

    # Journal minimal : ni corps, ni en-têtes (jamais X-API-Key), ni chaîne de requête.
    log_format  ragmin  '$time_iso8601 $request_method $uri $status $request_time';
    access_log  /dev/stdout  ragmin;

    # Égal à api.max_body_bytes (vérifié par test_compose_security.py) ; au-delà, 413.
    client_max_body_size     8k;
    client_body_buffer_size  8k;

    # DNS de Docker interrogé à chaque requête : une recréation de rag-api ne casse pas la passerelle.
    resolver  127.0.0.11  valid=10s  ipv6=off;
    resolver_timeout  5s;

    # Délais : l'API coupe elle-même à 120 s (503) ; la passerelle attend un peu plus.
    proxy_connect_timeout  5s;
    proxy_read_timeout     130s;
    proxy_send_timeout     30s;

    # En-têtes du client relayés tels quels, sans X-Forwarded-*, sans cache ni compression.
    proxy_http_version  1.1;
    proxy_set_header    Host        rag-api;
    proxy_set_header    Connection  "";
    proxy_buffering     on;

    # 30 questions par minute et par client (rafale de 10) : plafonne la dépense LLM.
    limit_req_zone    $binary_remote_addr  zone=questions:1m  rate=30r/m;
    limit_req_status  429;

    server {
        listen  8080;
        server_name  _;

        set $rag_api_host  rag-api:8000;

        # Aucune route ne prend de chaîne de requête.
        if ($args != "") { return 404; }

        # Trois routes, une méthode chacune, URI relayée fixe ; tout le reste reçoit 404.
        location = /health {
            if ($request_method != GET) { return 404; }
            proxy_pass  http://$rag_api_host/health;
        }

        location = /ready {
            if ($request_method != GET) { return 404; }
            proxy_pass  http://$rag_api_host/ready;
        }

        location = /v1/questions {
            if ($request_method != POST) { return 404; }
            limit_req   zone=questions  burst=10  nodelay;
            proxy_pass  http://$rag_api_host/v1/questions;
        }

        location / {
            return 404;
        }
    }
}
