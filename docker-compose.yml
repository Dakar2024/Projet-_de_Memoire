x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Plafond de tâches simultanées : avec LocalExecutor chaque tâche est un processus du
    # conteneur scheduler (limité à 2g sur le VPS). Le défaut de 32 risquerait l'OOM.
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__DAGS_FOLDER: /opt/projet/dags
    # Les tâches joignent l'API d'exécution de l'api-server : localhost désignerait
    # le conteneur du scheduler lui-même.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Partagé entre composants : sinon chaque conteneur génère le sien.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    PYTHONPATH: /opt/projet:/opt/projet/src
    LAKE_URI: "s3://"
    AWS_ENDPOINT_URL: "http://minio:9000"
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    AWS_REGION: us-east-1
    NCBI_EMAIL: ${NCBI_EMAIL}
    NCBI_API_KEY: ${NCBI_API_KEY:-}
  volumes:
    - .:/opt/projet
  working_dir: /opt/projet
  depends_on: &airflow-depends-on
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy

# Les services longs attendent la fin de `airflow db migrate` : sans cela, ils démarrent
# contre une base non migrée et bouclent en erreur jusqu'à ce que la migration aboutisse.
x-airflow-after-init: &airflow-after-init
  postgres:
    condition: service_healthy
  minio:
    condition: service_healthy
  airflow-init:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      # Ports hôte configurables : sur une machine de développement, 9000 et 9001
      # sont souvent déjà pris (Portainer, un autre MinIO). Les services Airflow
      # joignent MinIO par le réseau Docker (minio:9000), pas par ces ports.
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  minio-init:
    image: quay.io/minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "/scripts/create-buckets.sh"]
    volumes:
      - ./docker/minio/create-buckets.sh:/scripts/create-buckets.sh:ro

  airflow-init:
    <<: *airflow-common
    # Migration puis création du pool `ncbi` (NCBI_POOL des DAGs) : un slot, parce que le
    # limiteur de débit NCBI est par processus. `pools set` écrase le pool existant, donc
    # la commande est idempotente. `bash` passe par l'entrypoint de l'image, qui prépare
    # l'utilisateur au uid arbitraire avant d'exécuter la commande.
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        airflow pools set ncbi 1 "E-utilities NCBI : une tâche à la fois, limite de débit globale"
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    depends_on: *airflow-after-init
    command: api-server
    ports:
      - "8080:8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536m

  airflow-scheduler:
    <<: *airflow-common
    depends_on: *airflow-after-init
    command: scheduler
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Avec LocalExecutor, les tâches s'exécutent dans ce conteneur.
          memory: 2g

  airflow-dag-processor:
    <<: *airflow-common
    depends_on: *airflow-after-init
    command: dag-processor
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  airflow-triggerer:
    <<: *airflow-common
    depends_on: *airflow-after-init
    command: triggerer
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768m

volumes:
  postgres-data:
  minio-data:
