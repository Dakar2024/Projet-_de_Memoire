x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  # Le dépôt est monté en écriture (`data/external/` reçoit le bulk ClinVar) : le
  # conteneur doit tourner sous le uid propriétaire de ces dossiers sur l'hôte. Groupe 0
  # et uid arbitraire, selon la convention de l'image officielle.
  user: "${AIRFLOW_UID:?AIRFLOW_UID obligatoire, sortie de id -u sur l hôte}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Plafond de tâches simultanées : avec LocalExecutor chaque tâche est un processus du
    # conteneur scheduler (limité à 2g sur le VPS). Le défaut de 32 risquerait l'OOM.
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire, à renseigner}@postgres:5432/airflow
    AIRFLOW__CORE__DAGS_FOLDER: /opt/projet/dags
    # Les tâches joignent l'API d'exécution de l'api-server : localhost désignerait
    # le conteneur du scheduler lui-même.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Partagé entre composants : sinon chaque conteneur génère le sien.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?AIRFLOW_JWT_SECRET obligatoire, à renseigner}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    PYTHONPATH: /opt/projet:/opt/projet/src
    LAKE_URI: "s3://"
    AWS_ENDPOINT_URL: "http://minio:9000"
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD obligatoire, à renseigner}
    AWS_REGION: us-east-1
    NCBI_EMAIL: ${NCBI_EMAIL}
    NCBI_API_KEY: ${NCBI_API_KEY:-}
  volumes:
    - .:/opt/projet
  working_dir: /opt/projet
  networks:
    - genomique-network
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy

# Les services longs attendent la fin de `airflow db migrate` : sans cela, ils démarrent
# contre une base non migrée et bouclent en erreur jusqu'à ce que la migration aboutisse.
x-airflow-after-init: &airflow-after-init
  postgres:
    condition: service_healthy
  minio:
    condition: service_healthy
  # Les buckets doivent exister avant qu'une tâche n'écrive dans le lac.
  minio-init:
    condition: service_completed_successfully
  airflow-init:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    container_name: genomique-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire, à renseigner}
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - genomique-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  # Accès : API S3 sur http://localhost:${MINIO_API_PORT:-9000}, console web sur
  # http://localhost:${MINIO_CONSOLE_PORT:-9001} (identifiants : MINIO_ROOT_USER /
  # MINIO_ROOT_PASSWORD dans .env). Depuis les autres conteneurs du réseau
  # genomique-network, l'API reste jointe par le nom de service : http://minio:9000.
  minio:
    image: quay.io/minio/minio
    container_name: genomique-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD obligatoire, à renseigner}
    ports:
      # Ports hôte configurables : sur une machine de développement, 9000 et 9001
      # sont souvent déjà pris (Portainer, un autre MinIO). Les services Airflow
      # joignent MinIO par le réseau Docker (minio:9000), pas par ces ports.
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - genomique-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  minio-init:
    image: quay.io/minio/mc
    container_name: genomique-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD obligatoire, à renseigner}
    entrypoint: ["/bin/sh", "/scripts/create-buckets.sh"]
    volumes:
      - ./docker/minio/create-buckets.sh:/scripts/create-buckets.sh:ro
    networks:
      - genomique-network

  airflow-init:
    <<: *airflow-common
    container_name: genomique-airflow-init
    # Migration puis création du pool `ncbi` (NCBI_POOL des DAGs) : un slot, parce que le
    # limiteur de débit NCBI est par processus. `pools set` écrase le pool existant, donc
    # la commande est idempotente. `bash` passe par l'entrypoint de l'image, qui prépare
    # l'utilisateur au uid arbitraire avant d'exécuter la commande.
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        airflow pools set ncbi 1 "E-utilities NCBI : une tâche à la fois, limite de débit globale"
    restart: "no"

  # Accès : interface web (et API REST) sur http://localhost:8080, utilisateur admin,
  # mot de passe généré dans /opt/airflow/simple_auth_manager_passwords.json.generated
  # du conteneur (voir README, section « Lancer le pipeline médaillon »). Depuis les
  # autres conteneurs du réseau genomique-network : http://airflow-apiserver:8080.
  airflow-apiserver:
    <<: *airflow-common
    container_name: genomique-airflow-apiserver
    depends_on: *airflow-after-init
    command: api-server
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1536m

  airflow-scheduler:
    <<: *airflow-common
    container_name: genomique-airflow-scheduler
    depends_on: *airflow-after-init
    command: scheduler
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      # `airflow jobs check` recharge toute la config et interroge la base à chaque
      # appel : 10s était trop juste (mesuré à ~10-11s), d'où de faux "unhealthy"
      # malgré une commande qui réussit ("Found one alive job.").
      timeout: 20s
      retries: 5
    deploy:
      resources:
        limits:
          # Avec LocalExecutor, les tâches s'exécutent dans ce conteneur. Mesuré en
          # conditions réelles sur le vrai bulk ClinVar (~6M lignes, conversion
          # raw_to_bronze) : le pic touchait exactement l'ancienne limite de 2g
          # (memory.peak == memory.max, 1806 réclamations dans memory.events),
          # sans OOM kill mais sans aucune marge — risqué avec PARALLELISM=4
          # (plusieurs tâches simultanées dans ce même conteneur).
          memory: 3g

  airflow-dag-processor:
    <<: *airflow-common
    container_name: genomique-airflow-dag-processor
    depends_on: *airflow-after-init
    command: dag-processor
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 20s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  airflow-triggerer:
    <<: *airflow-common
    container_name: genomique-airflow-triggerer
    depends_on: *airflow-after-init
    command: triggerer
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 20s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768m

volumes:
  postgres-data:
  minio-data:

networks:
  genomique-network:
    driver: bridge
