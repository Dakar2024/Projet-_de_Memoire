# Nom explicite : celui déduit du dossier (`-_`) donne des noms d'image invalides.
name: genomique

#======================= Ancres communes =======================#
# Journaux bornés : sans rotation, ils finissent par remplir le disque du serveur.
#===============================================================#
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

#=================== Ancre : services Airflow ==================#
# Image, environnement et montages partagés par tout Airflow
#===============================================================#
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  # UID du propriétaire de `data/` sur l'hôte (groupe 0, convention de l'image officielle).
  user: "${AIRFLOW_UID:?AIRFLOW_UID obligatoire, sortie de id -u sur l hôte}:0"
  security_opt:
    - no-new-privileges:true
  logging: *default-logging
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Les tâches tournent dans le conteneur du scheduler : au-delà de 4, risque d'OOM.
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire, à renseigner}@postgres:5432/airflow
    AIRFLOW__CORE__DAGS_FOLDER: /opt/projet/dags
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?AIRFLOW_JWT_SECRET obligatoire, à renseigner}
    # Format `utilisateur:rôle` ; le mot de passe vient de AIRFLOW_ADMIN_PASSWORD (écrit par airflow-init).
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD obligatoire, à renseigner}
    # Dans le volume des journaux, déjà inscriptible par l'UID du conteneur.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/logs/simple_auth_manager_passwords.json.generated
    PYTHONPATH: /opt/projet:/opt/projet/src
    LAKE_URI: "s3://"
    AWS_ENDPOINT_URL: "http://minio:9000"
    # Compte de service limité aux quatre buckets du médaillon, jamais les identifiants root.
    AWS_ACCESS_KEY_ID: ${MINIO_AIRFLOW_USER:?MINIO_AIRFLOW_USER obligatoire, à renseigner}
    AWS_SECRET_ACCESS_KEY: ${MINIO_AIRFLOW_PASSWORD:?MINIO_AIRFLOW_PASSWORD obligatoire, à renseigner}
    AWS_REGION: us-east-1
    NCBI_EMAIL: ${NCBI_EMAIL}
    NCBI_API_KEY: ${NCBI_API_KEY:-}
    # Alertes e-mail : SmtpNotifier lit la connection `smtp_default`, pas la section [smtp].
    # Resend en 465 (SSL implicite) : `disable_tls` évite un STARTTLS sur une session déjà chiffrée.
    # Sans ALERT_EMAIL, aucun envoi n'est tenté (dags/common/alerting.py).
    AIRFLOW_CONN_SMTP_DEFAULT: '{"conn_type": "smtp", "host": "smtp.resend.com", "port": 465, "login": "resend", "password": "${RESEND_API_KEY:-}", "extra": {"from_email": "${ALERT_FROM:-}", "disable_tls": true, "timeout": 30, "retry_limit": 3}}'
    ALERT_EMAIL: ${ALERT_EMAIL:-}
  volumes:
    - .:/opt/projet:ro
    - ./data:/opt/projet/data
    - ./data/models:/opt/projet/data/models:ro
    - airflow-logs:/opt/airflow/logs
  working_dir: /opt/projet
  networks:
    - genomique-network
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy

# Services Airflow longs : démarrent après la migration de la base et la création des buckets.
x-airflow-after-init: &airflow-after-init
  postgres:
    condition: service_healthy
  minio:
    condition: service_healthy
  minio-init:
    condition: service_completed_successfully
  airflow-init:
    condition: service_completed_successfully

# Secrets du RAG réservés au scheduler, seul service Airflow qui exécute index_rag_documents.
x-rag-indexer-env: &rag-indexer-env
  RAG_EMBEDDINGS_URL: http://rag-embeddings:8080
  RAG_EMBEDDINGS_API_KEY: ${RAG_EMBEDDINGS_API_KEY:?RAG_EMBEDDINGS_API_KEY obligatoire, à renseigner}
  RAG_PG_HOST: rag-postgres
  RAG_PG_PORT: "5432"
  RAG_PG_DB: rag
  RAG_PG_USER: rag_indexer
  RAG_PG_PASSWORD: ${RAG_INDEXER_PASSWORD:?RAG_INDEXER_PASSWORD obligatoire, à renseigner}
  RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:?RAG_EMBEDDING_MODEL obligatoire, à renseigner}

#==================== Ancre : applications RAG =================#
# Image rag-api, durcie, sortie Internet par rag-proxy uniquement
#===============================================================#
x-rag-app: &rag-app
  build:
    context: .
    dockerfile: docker/rag-api/Dockerfile
    target: production
  user: "${AIRFLOW_UID:?AIRFLOW_UID obligatoire, sortie de id -u sur l hôte}:0"
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *default-logging
  working_dir: /opt/projet
  networks:
    - rag-network
    - rag-proxy-net
  depends_on:
    rag-proxy:
      condition: service_healthy

# Environnement commun sans clé LLM : chaque service n'ajoute que les clés dont il a besoin.
x-rag-app-env: &rag-app-env
  PYTHONPATH: /opt/projet:/opt/projet/src
  HTTPS_PROXY: http://rag-proxy:3128
  HTTP_PROXY: http://rag-proxy:3128
  NO_PROXY: rag-postgres,rag-embeddings,rag-api,rag-gateway,localhost,127.0.0.1
  RAG_EMBEDDINGS_URL: http://rag-embeddings:8080
  RAG_EMBEDDINGS_API_KEY: ${RAG_EMBEDDINGS_API_KEY:?RAG_EMBEDDINGS_API_KEY obligatoire, à renseigner}
  RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:?RAG_EMBEDDING_MODEL obligatoire, à renseigner}
  RAG_PG_HOST: rag-postgres
  RAG_PG_PORT: "5432"
  RAG_PG_DB: rag
  RAG_PG_USER: rag_reader
  RAG_PG_PASSWORD: ${RAG_READER_PASSWORD:?RAG_READER_PASSWORD obligatoire, à renseigner}

services:
#======================= PostgreSQL (Airflow) ==================#
# Base de métadonnées d'Airflow, sans port publié
#===============================================================#
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: genomique-postgres
    restart: unless-stopped
    # Laisse PostgreSQL écrire son point de contrôle avant l'arrêt (10 s par défaut).
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire, à renseigner}
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - genomique-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

#=========================== MinIO =============================#
# Lac médaillon (raw, bronze, silver, gold)
# Url dans le navigateur (console) : http://localhost:9001
# Connexion : MINIO_ROOT_USER / MINIO_ROOT_PASSWORD du .env
# API S3 : http://localhost:9000
#===============================================================#
  # Compilé depuis les sources (docker/minio/Dockerfile), joignable seulement par le proxy.
  minio-server:
    image: genomique/minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: docker/minio
      target: server
    container_name: genomique-minio
    restart: unless-stopped
    stop_grace_period: 30s
    command: server /data --console-address ":9001"
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER obligatoire, à renseigner}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD obligatoire, à renseigner}
    volumes:
      - minio-data:/data
    networks:
      - minio-backend
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  # Seule entrée vers MinIO : filtre les CVE de 2026 non corrigées (docker/minio/nginx.conf).
  # Nommé `minio` : les clients gardent http://minio:9000.
  minio:
    image: nginxinc/nginx-unprivileged:1.30-alpine@sha256:15c994d10d6d78658721c3bcafff14cb281fba2a4bdf9d5ba92c416a472516e3
    container_name: genomique-minio-proxy
    restart: unless-stopped
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    # nginx lancé directement : les scripts d'entrée réécriraient la configuration montée.
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    volumes:
      - ./docker/minio/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - genomique-network
      - minio-backend
    depends_on:
      minio-server:
        condition: service_healthy
    # Traverse le proxy jusqu'au serveur.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64m

#======================== MinIO (amorçage) =====================#
# Buckets, politique et compte de service, puis s'arrête
#===============================================================#
  minio-init:
    image: genomique/minio-mc:RELEASE.2025-08-13T08-35-41Z
    build:
      context: docker/minio
      target: mc
    container_name: genomique-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    # Seul service à voir les identifiants root de MinIO.
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER obligatoire, à renseigner}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD obligatoire, à renseigner}
      MINIO_AIRFLOW_USER: ${MINIO_AIRFLOW_USER:?MINIO_AIRFLOW_USER obligatoire, à renseigner}
      MINIO_AIRFLOW_PASSWORD: ${MINIO_AIRFLOW_PASSWORD:?MINIO_AIRFLOW_PASSWORD obligatoire, à renseigner}
    entrypoint: ["/bin/sh", "/scripts/create-buckets.sh"]
    volumes:
      - ./docker/minio/create-buckets.sh:/scripts/create-buckets.sh:ro
    networks:
      - genomique-network

#======================== Airflow (amorçage) ===================#
# Migration, mot de passe admin et pools, puis s'arrête (idempotent)
#===============================================================#
  airflow-init:
    <<: *airflow-common
    container_name: genomique-airflow-init
    restart: "no"
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        python3 -c "import json, os; p = os.environ['AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE']; os.makedirs(os.path.dirname(p), exist_ok=True); d = json.load(open(p)) if os.path.exists(p) else {}; d['admin'] = os.environ['AIRFLOW_ADMIN_PASSWORD']; json.dump(d, open(p, 'w'))" &&
        airflow pools set ncbi 1 "E-utilities NCBI : une tâche à la fois, limite de débit globale" &&
        airflow pools set conversion_lourde 1 "Conversions lourdes et écritures Delta partagées : une à la fois (plafond mémoire 3 Go)" &&
        airflow pools set rag_index 1 "Indexation RAG : une indexation à la fois, le service d'embedding sature le processeur"

#========================== Airflow ============================#
# Interface web et API d'exécution des tâches
# Url dans le navigateur : http://localhost:8080
# Connexion : admin / AIRFLOW_ADMIN_PASSWORD du .env
#===============================================================#
  airflow-apiserver:
    <<: *airflow-common
    container_name: genomique-airflow-apiserver
    restart: unless-stopped
    depends_on: *airflow-after-init
    command: api-server
    ports:
      # Boucle locale : pas de TLS devant l'interface.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1536m

#===================== Airflow (scheduler) =====================#
# Planifie et exécute les tâches (LocalExecutor), dont l'indexation RAG
#===============================================================#
  airflow-scheduler:
    <<: *airflow-common
    container_name: genomique-airflow-scheduler
    restart: unless-stopped
    depends_on: *airflow-after-init
    command: scheduler
    environment:
      <<: [*airflow-env, *rag-indexer-env]
    networks:
      - genomique-network
      - rag-network
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      # La vérification prend ~10-11 s : 20 s évite les faux « unhealthy ».
      timeout: 20s
      retries: 5
    deploy:
      resources:
        limits:
          # Pic mesuré à 2 Go sur raw_to_bronze ClinVar, plus la marge des tâches parallèles.
          memory: 3g

#=================== Airflow (dag-processor) ===================#
# Analyse des fichiers de DAG, isolée du scheduler
#===============================================================#
  airflow-dag-processor:
    <<: *airflow-common
    container_name: genomique-airflow-dag-processor
    restart: unless-stopped
    depends_on: *airflow-after-init
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 20s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

#====================== Airflow (triggerer) ====================#
# Tâches différées asynchrones
#===============================================================#
  airflow-triggerer:
    <<: *airflow-common
    container_name: genomique-airflow-triggerer
    restart: unless-stopped
    depends_on: *airflow-after-init
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 20s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768m

#===================== RAG — base vectorielle ==================#
# PostgreSQL + pgvector, joignable seulement depuis rag-network
#===============================================================#
  rag-postgres:
    image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    container_name: genomique-rag-postgres
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    # rag_owner n'amorce que le schéma ; Airflow écrit avec rag_indexer, l'API lit avec rag_reader.
    environment:
      POSTGRES_USER: rag_owner
      POSTGRES_PASSWORD: ${RAG_OWNER_PASSWORD:?RAG_OWNER_PASSWORD obligatoire, à renseigner}
      POSTGRES_DB: rag
    volumes:
      - rag-postgres-data:/var/lib/postgresql/data
    networks:
      - rag-network
    healthcheck:
      # TCP et non socket : le serveur temporaire d'initialisation n'écoute que sur le socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rag_owner -d rag"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

#================= RAG — base vectorielle (amorçage) ===========#
# Schéma, comptes et droits à chaque démarrage, puis s'arrête
#===============================================================#
  rag-postgres-init:
    image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    container_name: genomique-rag-postgres-init
    restart: "no"
    depends_on:
      rag-postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    # Mots de passe lus par \getenv dans le script, jamais visibles dans la liste des processus.
    environment:
      PGHOST: rag-postgres
      PGDATABASE: rag
      PGUSER: rag_owner
      PGPASSWORD: ${RAG_OWNER_PASSWORD:?RAG_OWNER_PASSWORD obligatoire, à renseigner}
      RAG_INDEXER_PASSWORD: ${RAG_INDEXER_PASSWORD:?RAG_INDEXER_PASSWORD obligatoire, à renseigner}
      RAG_READER_PASSWORD: ${RAG_READER_PASSWORD:?RAG_READER_PASSWORD obligatoire, à renseigner}
    entrypoint: ["psql", "-q", "-f", "/sql/001_schema.sql"]
    volumes:
      - ./RAG/sql:/sql:ro
    networks:
      - rag-network

#===================== RAG — embeddings (CPU) ==================#
# Text Embeddings Inference, modèle exporté localement
#===============================================================#
  rag-embeddings: &rag-embeddings
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    container_name: genomique-rag-embeddings
    restart: unless-stopped
    user: "${AIRFLOW_UID:?AIRFLOW_UID obligatoire, sortie de id -u sur l hôte}:0"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      API_KEY: ${RAG_EMBEDDINGS_API_KEY:?RAG_EMBEDDINGS_API_KEY obligatoire, à renseigner}
    command: ["--model-id", "/models/${RAG_EMBEDDING_MODEL:?RAG_EMBEDDING_MODEL obligatoire, à renseigner}", "--pooling", "mean", "--port", "8080"]
    volumes:
      - ./data/models:/models:ro
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          # Pic mesuré à 1,01 Go sur CPU.
          memory: 2g

#===================== RAG — embeddings (GPU) ==================#
# Réindexation rapide sur GPU NVIDIA (profil « gpu », RAG/README.md §4)
# Remplace rag-embeddings sous le même nom réseau : arrêter d'abord le service CPU
#===============================================================#
  rag-embeddings-gpu:
    <<: *rag-embeddings
    profiles: ["gpu"]
    image: ghcr.io/huggingface/text-embeddings-inference:turing-1.9@sha256:f78d17832f00f59f7d52e4b3b8495264257de3c18b773357a00ee341b2af852d
    container_name: genomique-rag-embeddings-gpu
    restart: "no"
    networks:
      rag-network:
        aliases:
          - rag-embeddings
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

#===================== RAG — proxy sortant =====================#
# Squid : seule sortie Internet du RAG (OpenRouter, Groq)
#===============================================================#
  rag-proxy:
    # Empreinte à rafraîchir à chaque avis de sécurité Squid (RAG/README.md §9.7).
    image: ubuntu/squid:6.6-24.04_edge@sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c
    container_name: genomique-rag-proxy
    restart: unless-stopped
    user: "13:13"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    # Squid lancé directement : l'entrypoint de l'image écrit dans une racine en lecture seule.
    entrypoint: ["/usr/sbin/squid"]
    command: ["-f", "/etc/squid/squid.conf", "-NYC"]
    volumes:
      - ./docker/rag-proxy/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - rag-proxy-net
      - rag-egress
    healthcheck:
      # Ni curl ni squidclient dans l'image : simple ouverture TCP sur 3128.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3128"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m

#========================== RAG — API ==========================#
# Litestar : questions en français, réponses sourcées et vérifiées
# Accessible uniquement par rag-gateway
#===============================================================#
  rag-api:
    <<: *rag-app
    container_name: genomique-rag-api
    restart: unless-stopped
    environment:
      <<: *rag-app-env
      # `:-` : une clé absente ne bloque pas Compose ; le code refuse lui-même de s'en passer.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      RAG_API_KEY: ${RAG_API_KEY:-}
    volumes:
      - ./RAG:/opt/projet/RAG:ro
      - ./src:/opt/projet/src:ro
      - ./data/models:/opt/projet/data/models:ro
    command: ["uvicorn", "RAG.src.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000",
              "--workers", "1", "--no-server-header", "--no-access-log", "--log-level", "info"]
    # Couvre 2 × api.request_timeout_s : requêtes en cours puis fils actifs (vérifié par test_compose_security.py).
    stop_grace_period: 250s
    networks:
      - rag-network
      - rag-proxy-net
      - rag-gateway-net
    depends_on:
      rag-proxy:
        condition: service_healthy
      rag-embeddings:
        condition: service_healthy
      rag-postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1536m

#======================== RAG — passerelle =====================#
# nginx, seul accès à l'API depuis l'hôte, sans secret
# Url de l'API : http://localhost:8090 (GET /health, GET /ready, POST /v1/questions)
# Clé : en-tête X-API-Key = RAG_API_KEY du .env
#===============================================================#
  rag-gateway:
    image: nginxinc/nginx-unprivileged:1.30-alpine@sha256:15c994d10d6d78658721c3bcafff14cb281fba2a4bdf9d5ba92c416a472516e3
    container_name: genomique-rag-gateway
    restart: unless-stopped
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    # nginx lancé directement : les scripts d'entrée réécriraient la configuration montée.
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    volumes:
      - ./docker/rag-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${RAG_API_PORT:-8090}:8080"
    networks:
      - rag-api-ingress
      - rag-gateway-net
    depends_on:
      rag-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64m

#================== Outil — export des modèles =================#
# À la demande (profil « outils ») : export ONNX épinglé vers data/models
#===============================================================#
  rag-model-export:
    profiles: ["outils"]
    build:
      context: .
      dockerfile: docker/embeddings/Dockerfile.export
    restart: "no"
    user: "${AIRFLOW_UID:?AIRFLOW_UID obligatoire, sortie de id -u sur l hôte}:0"
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      HF_HOME: /tmp/hf
    volumes:
      - ./data/models:/models
    networks:
      - rag-export
    deploy:
      resources:
        limits:
          memory: 4g

#=================== Outil — recherche et mesures ==============#
# À la demande (profil « outils ») : mesures E2a, recette E2b, évaluation E3a
#===============================================================#
  rag-search:
    <<: *rag-app
    profiles: ["outils"]
    environment:
      <<: *rag-app-env
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - ./RAG:/opt/projet/RAG:ro
      - ./src:/opt/projet/src:ro
      - ./data/models:/opt/projet/data/models:ro
      # Seuls dossiers inscriptibles ; à créer sur l'hôte avant (sinon Docker les crée en root).
      - ./data/experiments/e2a:/opt/projet/data/experiments/e2a
      - ./data/experiments/e2a-essai:/opt/projet/data/experiments/e2a-essai
      - ./data/experiments/e2b-recette:/opt/projet/data/experiments/e2b-recette
      - ./data/experiments/e3a:/opt/projet/data/experiments/e3a
    entrypoint: ["python"]
    deploy:
      resources:
        limits:
          memory: 1g

#================= Outil — tests d'intégration du RAG ==========#
# À la demande (profil « outils ») : image rag-api + pytest (RAG/README.md §9.9)
#===============================================================#
  rag-api-test:
    <<: *rag-app
    profiles: ["outils"]
    build:
      context: .
      dockerfile: docker/rag-api/Dockerfile
      target: test
    # Clé de l'API locale seulement : aucun test n'appelle directement le LLM.
    environment:
      <<: *rag-app-env
      RAG_API_KEY: ${RAG_API_KEY:-}
    networks:
      - rag-network
      - rag-proxy-net
      - rag-gateway-net
    volumes:
      - ./RAG:/opt/projet/RAG:ro
      - ./src:/opt/projet/src:ro
      - ./data/models:/opt/projet/data/models:ro
    entrypoint: ["python", "-m", "pytest", "-p", "no:cacheprovider"]

#===================== Volumes persistants =====================#
# Données conservées entre redémarrages et mises à jour (sauvegardées par scripts/sauvegarde.sh)
#===============================================================#
volumes:
  postgres-data:
  minio-data:
  airflow-logs:
  rag-postgres-data:

#=========================== Réseaux ===========================#
# Internes (sans Internet) sauf genomique-network, rag-api-ingress, rag-egress et rag-export
#===============================================================#
networks:
  genomique-network:
    driver: bridge
  # Proxy → serveur MinIO. Sous-réseau fixé : alloué automatiquement, il prenait 172.31.0.0/16
  # (dernier bloc du pool Docker) et chevauchait rag-proxy-net.
  minio-backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.251.0/24
  # Base vectorielle et embeddings : aucun accès sortant.
  rag-network:
    driver: bridge
    internal: true
  # Clients du proxy ; sous-réseau fixé, seul admis par squid.conf (acl rag_clients).
  rag-proxy-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.250.0/24
  # Publication du port de la passerelle (un réseau interne ne publie aucun port).
  rag-api-ingress:
    driver: bridge
  # Passerelle → API.
  rag-gateway-net:
    driver: bridge
    internal: true
  # Sortie Internet du seul rag-proxy.
  rag-egress:
    driver: bridge
  # Téléchargement des modèles épinglés par rag-model-export.
  rag-export:
    driver: bridge
