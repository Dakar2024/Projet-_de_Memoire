# Configuration non secrète du RAG ; secrets et adresses de service viennent du .env.

embedding:
  # Empreinte recopiée de data/models/<modèle>/export.json ; vide, l'indexation refuse de tourner.
  fingerprint: "NeuML/pubmedbert-base-embeddings@b79526d6ef36+onnx:2ab209f97e0a83ca"
  # Vecteurs de référence du modèle validé.
  canary_file: canari.json
  # GPU et CPU donnent ≥ 0,99897 pour un même texte ; un autre modèle, des vecteurs sans rapport.
  canary_min_cosine: 0.995
  # Plafond du service : 32 textes par requête.
  batch_size: 32
  request_timeout_s: 60

index:
  # Au-delà, une suppression massive trahit plutôt un Gold lu incomplètement (même seuil que le Silver).
  max_delete_ratio: 0.05

search:
  # Documents transmis au LLM de génération (E2b) et mesurés en E2a.
  k: 10
  # En dessous, le filtre de signification est relâché et la trace le signale.
  min_filtered: 3
  # Au-delà, la question est refusée avant tout appel réseau (plafonne aussi le coût).
  max_question_chars: 1000

llm:
  # PROVISOIRE : profil d'essai (Groq) jusqu'à la mesure officielle de E2a.
  analysis_profile: essai-groq-gpt-oss-120b
  # PROVISOIRE : modèle de génération choisi par la mesure de E3a.
  generation_profile: essai-groq-gpt-oss-120b
  # Réponse JSON (texte ≤ 4 000 caractères + citations) et réflexion interne comprises.
  generation_max_tokens: 3000
  request_timeout_s: 60
  # La réflexion interne du modèle compte dans ce plafond (documentation OpenRouter).
  max_tokens: 2000
  # Chaque profil fige un point d'accès à zéro rétention et sorties structurées.
  profiles:
    claude-opus-5.5:
      model: anthropic/claude-opus-5.5
      provider_tag: google-vertex/europe
      provider_name: Google
      quantization: null
    mistral-medium:
      model: mistralai/mistral-medium-3-5
      provider_tag: mistral/zdr
      provider_name: Mistral
      quantization: null
    gpt-oss-120b:
      model: openai/gpt-oss-120b
      provider_tag: deepinfra/bf16
      provider_name: DeepInfra
      quantization: bf16
  # Essai gratuit (Groq), jamais candidat de la règle de choix ; provider_tag y est informatif.
  trial_profiles:
    essai-groq-gpt-oss-120b:
      model: openai/gpt-oss-120b
      backend: groq
      provider_tag: groq
      provider_name: Groq
      quantization: null

api:
  # Questions simultanées, une connexion PostgreSQL chacune ; au-delà, 429.
  max_concurrency: 4
  # Délai total d'une question (analyse, recherche, génération) ; au-delà, 503.
  request_timeout_s: 120
  # Corps de requête maximal ; au-delà, 413.
  max_body_bytes: 8192
  # Documentation OpenAPI : désactivée (aucun client ne la consomme).
  openapi: false
