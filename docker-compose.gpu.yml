# Variante GPU du service d'embedding, pour accélérer une indexation complète sur la
# machine de développement (242 doc/s mesurés, contre 7 sur CPU). La production n'a
# pas de GPU : ce fichier ne s'ajoute qu'explicitement,
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d rag-embeddings
# Indexer sur GPU puis interroger sur CPU est sûr : cosinus ≥ 0,99897 pour un même
# texte, 99,9 % des dix plus proches voisins identiques (mesure du 01/10/2026).
# L'image Turing est marquée expérimentale par Hugging Face. Elle exige le
# NVIDIA Container Toolkit et un pilote compatible CUDA 12.2 ou plus.
services:
  rag-embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:turing-1.9@sha256:f78d17832f00f59f7d52e4b3b8495264257de3c18b773357a00ee341b2af852d
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
