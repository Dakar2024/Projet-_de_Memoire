[project]
name = "genomica-backend"
version = "0.1.0"
description = "Backend for frontend of the Genomica app: accounts, RAG relay, history, quotas and gold analytics."
requires-python = ">=3.13"
dependencies = [
    "litestar[standard]>=2.25",
    "piccolo[postgres]>=1.37",
    "pydantic[email]>=2.11",
    "pydantic-settings>=2.10",
    "argon2-cffi>=25.1",
    "pyjwt>=2.10",
    "aiosmtplib>=4.0",
    "jinja2>=3.1",
    "huey>=2.5",
    "redis>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx>=0.28",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["core", "features", "tests_integration"]
python_files = ["test_*.py"]
# Integration tests need compose.test.yml (make test-integration); left out of the default run.
addopts = "-m 'not integration'"
markers = ["integration: needs the PostgreSQL and Redis of compose.test.yml"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
